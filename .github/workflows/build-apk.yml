name: Build Doodh Khata APK

on:
  push:
    branches: [main, work/doodh-khata-source-access]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Doodh-Khata-Android-Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Doodh-Khata-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload original Android source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Doodh-Khata-Android-Source
          path: Doodh-Khata-Android-Project.zip
